name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Shared-core gate (issue #65): fmt+clippy+test fan out over all
    # three OSes so the framework-free core promise cannot rot on any
    # platform. The gpui binary is macOS-gated in src/main.rs (stub
    # main elsewhere, macOS-scoped deps in Cargo.toml), so
    # `cargo test --all-targets` is the full GUI suite on macOS and
    # the portable lib suite plus a stub bin off macOS; each native
    # shell proves itself in its own per-OS job below. fail-fast is
    # off so one red OS never hides the other two (fail visible).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets

  macos:
    # Native macOS Swift shell (issue #62): SPM build + unit tests +
    # headless C ABI smoke against the real staticlib, then a zip
    # artifact (dmg/notarization are explicit non-goals — see
    # packaging/README.md). Runs on macos-latest only and touches
    # nothing outside swift/ + the core staticlib.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: core staticlib
        run: cargo build --lib
      - name: no gpui in the macOS shell
        run: |
          ! grep -rni gpui swift/Sources swift/Tests swift/Package.swift
      - name: swift build
        run: swift build --package-path swift
      - name: swift test
        run: swift test --package-path swift
      - name: headless smoke (real C ABI)
        run: swift/.build/debug/AgentManagerMac --smoke
      - name: package (zip; dmg stubbed — see packaging/README.md)
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            swift/.build/debug/AgentManagerMac \
            dist/AgentManagerMac-macos.zip
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentManagerMac-macos
          path: dist/AgentManagerMac-macos.zip

  linux:
    # Native Linux GTK shell (issue #63): the core library plus the
    # meson-built GTK4/libadwaita/VTE shell against the real C ABI.
    # The gpui binary is macOS-only (macOS-scoped deps in Cargo.toml),
    # so this job gates the lib and the meson suite, never --all-targets.
    # Runs on ubuntu-latest only and touches nothing outside
    # native/linux + the core staticlib. Ships a tarball; .deb/flatpak
    # are stubbed with a tracking note (see packaging/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: system deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev
          meson ninja-build pkg-config gcc xvfb
      - name: core staticlib
        run: cargo build --lib
      - name: core tests
        run: cargo test --lib
      - name: no gpui in the Linux shell
        run: |
          ! grep -rni gpui native/linux/
      - name: meson build
        run: >
          meson setup native/linux/build native/linux
          -Dcore_lib_dir=$PWD/target/debug &&
          meson compile -C native/linux/build
      - name: meson tests
        run: meson test -C native/linux/build --print-errorlogs
      - name: headless UI run
        run: |
          timeout -s TERM 15 xvfb-run -a ./native/linux/build/agent-manager-gtk > /tmp/app.log 2>&1 || true
          grep -v 'libEGL\|DRI3\|session bus\|dbus-launch' /tmp/app.log | head -n 20
          ! grep -E 'Adwaita-ERROR|Gtk-CRITICAL|SMOKE-FAIL' /tmp/app.log
      - name: package (tarball; .deb/flatpak stubbed — see packaging/README.md)
        run: |
          mkdir -p dist
          tar -czf dist/agent-manager-linux.tar.gz \
            -C native/linux/build agent-manager-gtk
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-manager-linux
          path: dist/agent-manager-linux.tar.gz

  windows:
    # Native Windows WinUI shell (issue #64): the core library plus the
    # CMake-built C suite against the real C ABI, plus the MSVC-built
    # WinUI 3 + ConPTY shell (unpackaged exe, no MSIX — packaging lives
    # with the CI/packaging issue, see packaging/README.md). Unlike the
    # Linux job this one runs `cargo test --all-targets`, per the
    # issue's acceptance criteria: the gpui binary is macOS-gated in
    # src/main.rs, so on this runner that exercises the full portable
    # lib suite plus a stub bin, while the per-shell proof lives in the
    # CMake/CTest and WinUI steps. Runs on windows-latest only and
    # touches nothing outside native/windows + the core staticlib.
    # Ships an unpackaged zip of the C suite + WinUI exe.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: core staticlib
        run: cargo build --lib
      - name: test
        run: cargo test --all-targets
      - name: no gpui in the Windows shell
        shell: pwsh
        run: |
          $hits = Get-ChildItem native/windows -Recurse -File | Select-String -Pattern 'gpui'
          if ($hits) { $hits; exit 1 }
      - name: C suite (CMake, MSVC)
        shell: pwsh
        run: |
          cmake -S native/windows -B native/windows/build `
            "-Dcore_lib_dir=$env:GITHUB_WORKSPACE/target/debug"
          cmake --build native/windows/build --config Release
          ctest --test-dir native/windows/build -C Release --output-on-failure
      - name: live converse (fake muse.exe)
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass
          -File native/windows/tests/smoke_live.ps1
          -Smoke ./native/windows/build/Release/am-win-smoke.exe
      - name: TEMPORARY-DIAGNOSTICS pp eval (refs #64)
        shell: pwsh
        run: |
          msbuild -version
          $pp = "$env:RUNNER_TEMP/winui-pp.xml"
          msbuild native/windows/AgentManagerWinUI.vcxproj "/pp:$pp" /p:Configuration=Release /p:Platform=x64 "/p:CoreLibDir=$env:GITHUB_WORKSPACE/target/debug" -nologo -v:m
          Write-Host "=== pp grep (first 60) ==="
          Select-String -Path $pp -Pattern 'TargetFramework|TargetFrameworks|TargetFrameworkVersion|TargetPlatformIdentifier|TargetPlatformVersion|ApplicationType|RestoreProjectStyle|NuGetTargetMoniker|ResolveNuGetPackageAssets' | Select-Object -First 60 | ForEach-Object { $_.Line.Trim() }
          Write-Host "=== UAP targeting pack probe ==="
          dir "${env:ProgramFiles(x86)}\Windows Kits\10\References" -ErrorAction SilentlyContinue | Out-String -Width 200
          $vp = & vswhere -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.BuildTools -property installationPath 2>$null
          if ($vp) { Write-Host "UWP-BUILDTOOLS-FOUND: $vp" } else { Write-Host "UWP-BUILDTOOLS-NOT-FOUND" }
      - name: WinUI build (unpackaged exe, no MSIX)
        shell: pwsh
        # Restore MUST share one evaluation with the build (runs 36331814809
        # and 36332622155, refs #64): even with matching
        # Configuration/Platform, separate `msbuild -t:restore` + `msbuild`
        # invocations re-evaluate the vcxproj (the build additionally passes
        # CoreLibDir), so project.assets.json drifts from the Release|x64
        # build's UAP expectation and ResolveNuGetPackageAssets fails with
        # `does not reference "UAP,Version=v10.0"`. A single `msbuild /restore`
        # restores then builds in one evaluation with identical properties.
        run: |
          msbuild native/windows/AgentManagerWinUI.vcxproj /restore `
            /p:Configuration=Release /p:Platform=x64 `
            "/p:CoreLibDir=$env:GITHUB_WORKSPACE/target/debug"
      - name: package (unpackaged zip; MSIX stubbed — see packaging/README.md)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path native/windows/build/Release/*, native/windows/bin/x64/Release/* `
            -DestinationPath dist/AgentManagerWindows.zip
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentManagerWindows
          path: dist/AgentManagerWindows.zip
