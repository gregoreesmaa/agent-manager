# cbindgen config for include/staap.h (issue #61).
# Regenerate: cbindgen --config cbindgen.toml --crate staap \
#   --output include/staap.h
language = "C"
include_guard = "STAAP_H"
autogen_warning = "/* Warning: regenerate with cbindgen, do not hand-edit beyond the checked-in snapshot. */"
sys_includes = ["stddef.h"]

[defines]
"target_os = macos" = "OS_MACOS"
"target_os = linux" = "OS_LINUX"
"target_os = windows" = "OS_WINDOWS"
