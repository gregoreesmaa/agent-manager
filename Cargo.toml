[package]
name = "agent-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "agent-manager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
regex = "1"
portable-pty = "0.9"
vt100 = "0.15"
gpui = "0.2.2"
# Native chrome components (Button, List, Sidebar, …) on the pinned gpui
# 0.2.2 line. Pinned to 0.5.x: 0.6+ moved to the gpui-pre 0.3.6 fork and
# would force a framework migration (see `gpui_version_is_pinned`).
gpui-component = "=0.5.1"
